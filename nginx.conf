server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # go2rtc API: snapshots (frame.jpeg) and stream state.
    # resolver lets nginx re-resolve the go2rtc container IP if it restarts.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $go2rtc go2rtc:1984;
        proxy_pass http://$go2rtc;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
